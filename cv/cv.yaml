sections:
  - heading: Research and Teaching Interests
    style: prose
    text: "Most of my research for over three decades has concerned the error-related negativity (ERN), a brain electrical response that I helped discover, which occurs when people make mistakes; I have used it to study the development of executive function in children and its disruption in anxiety disorders such as OCD. Teaching undergraduates is another major interest. Years in the classroom convinced me that many students rely on learning strategies that cognitive psychology has shown to be ineffective, so I created the course *Cognitive Science of Academic Success* to help first-year students become better, self-regulated learners. More recently I have turned to building AI tutors that put those strategies into practice, and to research using institutional data to study how curricular factors help or hinder academic success, especially for students from underserved communities."

